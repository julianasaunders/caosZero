<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>CaosZero Logo</title>
<style>html,body{margin:0;padding:0;background:#0b1020;display:flex;align-items:center;justify-content:center;height:100vh}svg{width:512px;height:512px}</style>
</head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a1040"/><stop offset="100%" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c5cff"/><stop offset="100%" stop-color="#3fd16f"/></linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" ry="110" fill="none" stroke="rgba(124,92,255,0.25)" stroke-width="2"/>
  <text x="256" y="330" font-family="Montserrat, Inter, system-ui, sans-serif" font-size="230" font-weight="800" text-anchor="middle" fill="url(#grad)" filter="url(#glow)" letter-spacing="-8">C0</text>
</svg>
</body></html>
