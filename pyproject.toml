[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caoszero"
version = "2.0.0"
description = "Automatizador de tarefas com arquivos para a disciplina de Sistemas Operacionais"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Juliana Saunders" },
    { name = "Jaquelline Feitoza" },
]
keywords = ["sistemas-operacionais", "automacao", "organizacao-de-arquivos", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]

[project.scripts]
caoszero = "caoszero.cli:main"

[project.optional-dependencies]
native = ["pywebview>=6.0"]

[project.urls]
Homepage = "https://github.com/julianasaunders/caosZero"
Issues = "https://github.com/julianasaunders/caosZero/issues"
Wiki = "https://github.com/julianasaunders/caosZero/wiki"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
