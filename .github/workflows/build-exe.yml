name: Build Executável (Windows)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build CaosZero.exe (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview pyinstaller

      - name: Build (console + GUI)
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --name CaosZeroCLI --add-data "ui;ui" --paths src entry.py
          python -m PyInstaller --noconsole --onefile --name CaosZero --add-data "ui;ui" --paths src entry_gui.py

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: caoszero-windows
          path: |
            dist/CaosZero.exe
            dist/CaosZeroCLI.exe
          retention-days: 30

      - name: Anexar à release (se publicada)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CaosZero.exe
            dist/CaosZeroCLI.exe
